<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eficiencia Energética, Construcción Sostenible y Normativa - Bibliografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-base: #054C50; 
            --accent-bright: #4ce6ef; 
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(5, 76, 80, 0.4);
            --text-main: #ffffff;
            --text-dim: #d0f0f2;
        }

        body {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #021a1b;
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; cursor: default;
        }

        .fluid-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: #011112; filter: blur(80px);
        }
        .fluid-layer { position: absolute; border-radius: 50%; opacity: 0.35; animation: fluidMove infinite alternate ease-in-out; }
        .layer-1 { background: radial-gradient(circle, var(--accent-base) 0%, transparent 70%); width: 100vw; height: 100vw; top: -30%; left: -10%; animation-duration: 20s; }
        .layer-2 { background: radial-gradient(circle, #083335 0%, transparent 70%); width: 80vw; height: 80vw; bottom: -20%; right: -10%; animation-duration: 25s; }
        @keyframes fluidMove { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10%, 5%) scale(1.1); } }

        .nav-instruction {
            width: 90vw; max-width: 1400px;
            background: rgba(5, 76, 80, 0.15);
            border: 1px dashed var(--accent-bright);
            padding: 15px; border-radius: 12px;
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem; color: var(--accent-bright);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .main-header { text-align: center; padding: 30px 20px; z-index: 1; }
        .main-header h1 { font-weight: 300; font-size: 2rem; letter-spacing: 4px; text-transform: uppercase; margin: 0; background: linear-gradient(to right, #fff, var(--text-dim)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .main-header .line { width: 60px; height: 3px; background: var(--accent-bright); margin: 15px auto; }

        .reference-grid {
            display: grid; width: 90vw; max-width: 1400px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px; padding-bottom: 80px; z-index: 1;
        }

        .card {
            font-family: 'Poppins', sans-serif;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 25px;
            display: flex; flex-direction: column;
            transition: all 0.3s ease;
            min-height: 160px;
        }
        .card:hover { border-color: var(--accent-bright); transform: translateY(-5px); background: rgba(5, 76, 80, 0.12); box-shadow: 0 10px 20px rgba(5, 76, 80, 0.25); }

        .author-tag { font-size: 0.75rem; font-weight: 600; color: var(--accent-bright); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
        .title { font-size: 0.9rem; font-weight: 400; line-height: 1.6; color: var(--text-main); margin-bottom: 15px; }

        .footer-info {
            font-size: 0.75rem; font-weight: 300; color: var(--text-dim);
            border-top: 1px solid rgba(5, 76, 80, 0.3);
            padding-top: 15px; margin-top: auto; word-break: break-all;
        }

        .link-text {
            color: var(--accent-bright);
            text-decoration: underline;
            transition: color 0.2s;
        }
        .link-text:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="fluid-background">
        <div class="fluid-layer layer-1"></div>
        <div class="fluid-layer layer-2"></div>
    </div>

    <div class="nav-instruction">
        ⚡ <b>Instrucción de Navegación:</b> Consulta las referencias normativas, guías técnicas, estándares ASHRAE, ISO y reportes internacionales sobre eficiencia energética y edificación sostenible.
    </div>

    <header class="main-header">
        <h1>Bibliografía</h1>
        <div class="line"></div>
    </header>

    <main class="reference-grid" id="grid"></main>

    <script>
        const sources = [
            { a: "Akhtar, A., & Sarmah, A. K. (2018)", t: "Construction and demolition waste generation and properties of recycled aggregate concrete: A global perspective", f: "Journal of Cleaner Production", u: "https://doi.org/10.1016/j.jclepro.2018.03.085" },
            { a: "ASHRAE (2020a)", t: "ANSI/ASHRAE Standard 55-2020: Thermal environmental conditions for human occupancy", f: "ASHRAE", u: "https://www.ashrae.org/file%20library/technical%20resources/standards%20and%20guidelines/standards%20addenda/55_2020_a_20210430.pdf" },
            { a: "ASHRAE (2021)", t: "ASHRAE Handbook: Fundamentals 2021", f: "ASHRAE", u: "https://www.ashrae.org/technical-resources/ashrae-handbook/description-2021-ashrae-handbook-fundamentals" },
            { a: "ASHRAE (2022a)", t: "ANSI/ASHRAE Standard 62.1-2022: Ventilation and acceptable indoor air quality", f: "ASHRAE", u: "https://www.ashrae.org/file%20library/technical%20resources/standards%20and%20guidelines/standards%20addenda/62_1_2022_x_20221108.pdf" },
            { a: "Cabeza, L. F. et al. (2014)", t: "Life cycle assessment (LCA) and life cycle energy analysis (LCEA) of buildings and the building sector: A review", f: "Renewable and Sustainable Energy Reviews", u: "https://doi.org/10.1016/j.rser.2013.08.037" },
            { a: "CCCS (2023)", t: "Estado de la construcción sostenible en Colombia: Informe anual 2023", f: "Consejo Colombiano de Construcción Sostenible", u: "https://www.cccs.org.co/wp-content/uploads/2024/06/1.-2024-03-22-Informe-de-Gestion-CCCS-1.pdf" },
            { a: "Crawley, D. B. et al. (2001)", t: "EnergyPlus: Creating a new-generation building energy simulation program", f: "Energy and Buildings", u: "https://doi.org/10.1016/S0378-7788(00)00114-6" },
            { a: "Energycodes (2021)", t: "ANSI/ASHRAE/IES Standard 90.1-2019: Energy standard for buildings except low-rise residential buildings", f: "Energycodes", u: "https://www.energycodes.gov/sites/default/files/2021-07/20210407_Standard_90.1-2019_Determination_TSD.pdf" },
            { a: "European Parliament (2018)", t: "Directive 2018/844/EU amending Directive 2010/31/EU on energy performance of buildings", f: "European Parliament" },
            { a: "Givoni, B. (1994)", t: "Passive and low-energy cooling of buildings", f: "Van Nostrand Reinhold" },
            { a: "Hammond, G. P., & Jones, C. I. (2019)", t: "Inventory of Carbon and Energy (ICE) Version 3.0", f: "University of Bath" },
            { a: "Hensen, J. L., & Lamberts, R. (2011)", t: "Building performance simulation for design and operation", f: "Spon Press" },
            { a: "IDEAM (2014)", t: "Atlas de radiación solar, ultravioleta y ozono de Colombia", f: "IDEAM", u: "https://www.ideam.gov.co" },
            { a: "IEA (2023a)", t: "Energy efficiency 2023: Analysis and outlook to 2026", f: "International Energy Agency", u: "https://doi.org/10.1787/ebe9fe72-en" },
            { a: "IEA (2023b)", t: "Tracking buildings 2023", f: "International Energy Agency", u: "https://www.iea.org/energy-system/buildings" },
            { a: "IFC (2019)", t: "EDGE buildings: User guide version 3.0", f: "International Finance Corporation", u: "https://edgebuildings.com" },
            { a: "ISO (2006a)", t: "ISO 14040:2006: Environmental management, life cycle assessment, Principles and framework", f: "ISO", u: "https://www.iso.org/standard/37456.html" },
            { a: "ISO (2006b)", t: "ISO 14044:2006: Environmental management, life cycle assessment, requirements, and guidelines", f: "ISO", u: "https://www.iso.org/standard/38498.html" },
            { a: "ISO (2014)", t: "ISO 50002:2014: Energy audits, requirements with guidance for use", f: "ISO", u: "https://www.iso.org/standard/60088.html" },
            { a: "ISO (2017b)", t: "ISO 52016-1:2017: Energy performance of buildings, energy needs for heating and cooling", f: "ISO", u: "https://www.iso.org/standard/65696.html" },
            { a: "ISO (2018)", t: "ISO 50001:2018: Energy management systems, Requirements with guidance for use", f: "ISO", u: "https://www.iso.org/standard/69426.html" },
            { a: "Kibert, C. J. (2016)", t: "Sustainable construction: Green building design and delivery (4th ed.)", f: "Wiley" },
            { a: "Lechner, N. (2015)", t: "Heating, cooling, and lighting: Sustainable design methods for architects (4th ed.)", f: "Wiley" },
            { a: "Ley 1715 (2014)", t: "Por medio de la cual se regula la integración de las energías renovables no convencionales", f: "Congreso de Colombia", u: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=61317" },
            { a: "Lu, Y., Pigram, D., & Guo, J. (2021)", t: "Integrating building information modeling with energy performance simulation during early design stages", f: "Automation in Construction", u: "https://doi.org/10.1016/j.autcon.2021.103827" },
            { a: "Minambiente (2018)", t: "El Protocolo de Kigali y el sector refrigeración en Colombia", f: "Ministerio de Ambiente y Desarrollo Sostenible", u: "https://www.minambiente.gov.co" },
            { a: "Ortiz, R. O., Castells, F., & Sonnemann, G. (2010)", t: "Life cycle assessment of two dwellings: One in Spain, and one in Colombia", f: "Science of the Total Environment", u: "https://doi.org/10.1016/j.scitotenv.2010.02.021" },
            { a: "Passivhaus Institut (2016)", t: "Passive house criteria", f: "Passivhaus Institut", u: "https://passiv.de/en/02_informations/02_passive-house-requirements/02_passive-house-requirements.htm" },
            { a: "Pérez, L., Ortiz, J., & Pout, C. (2008)", t: "A review on buildings energy consumption information", f: "Energy and Buildings", u: "https://doi.org/10.1016/j.enbuild.2007.03.007" },
            { a: "Resolución 0549 (2015)", t: "Parámetros y lineamientos de construcción sostenible y guía para el ahorro de agua y energía", f: "MinVivienda", u: "https://www.minvivienda.gov.co" },
            { a: "UNEP (2022)", t: "2022 global status report for buildings and construction", f: "United Nations Environment Programme", u: "https://globalabc.org/resources/publications/2022-global-status-report-buildings-and-construction" },
            { a: "UPME (2022)", t: "Plan de acción indicativo de eficiencia energética 2022–2030: PROURE", f: "UPME", u: "https://www1.upme.gov.co" },
            { a: "USGBC (2023)", t: "Building design and construction reference guide", f: "USGBC", u: "https://www.usgbc.org/leed" },
            { a: "WorldGBC (2019)", t: "Bringing embodied carbon upfront: Coordinated action for the building and construction sector", f: "WorldGBC", u: "https://worldgbc.org/embodied-carbon" },
            { a: "WorldGBC (2023)", t: "The business case for healthy buildings: Insights from early adopters", f: "WorldGBC", u: "https://worldgbc.org" }
        ];

        const grid = document.getElementById('grid');

        sources.forEach((s) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let footerContent = s.f;
            if (s.u) {
                footerContent += ` — <a href="${s.u}" target="_blank" class="link-text">${s.u}</a>`;
            }

            let html = `
                <div class="author-tag">${s.a}</div>
                <div class="title">${s.t}</div>
                <div class="footer-info">${footerContent}</div>
            `;

            card.innerHTML = html;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
