<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construcción Sostenible, Ciclo de Vida e Impacto Ambiental - Bibliografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-base: #054C50; 
            --accent-bright: #4ce6ef; 
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(5, 76, 80, 0.4);
            --text-main: #ffffff;
            --text-dim: #d0f0f2;
        }

        body {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #021a1b;
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; cursor: default;
        }

        .fluid-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: #011112; filter: blur(80px);
        }
        .fluid-layer { position: absolute; border-radius: 50%; opacity: 0.35; animation: fluidMove infinite alternate ease-in-out; }
        .layer-1 { background: radial-gradient(circle, var(--accent-base) 0%, transparent 70%); width: 100vw; height: 100vw; top: -30%; left: -10%; animation-duration: 20s; }
        .layer-2 { background: radial-gradient(circle, #083335 0%, transparent 70%); width: 80vw; height: 80vw; bottom: -20%; right: -10%; animation-duration: 25s; }
        @keyframes fluidMove { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10%, 5%) scale(1.1); } }

        .nav-instruction {
            width: 90vw; max-width: 1400px;
            background: rgba(5, 76, 80, 0.15);
            border: 1px dashed var(--accent-bright);
            padding: 15px; border-radius: 12px;
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem; color: var(--accent-bright);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .main-header { text-align: center; padding: 30px 20px; z-index: 1; }
        .main-header h1 { font-weight: 300; font-size: 2rem; letter-spacing: 4px; text-transform: uppercase; margin: 0; background: linear-gradient(to right, #fff, var(--text-dim)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .main-header .line { width: 60px; height: 3px; background: var(--accent-bright); margin: 15px auto; }

        .reference-grid {
            display: grid; width: 90vw; max-width: 1400px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px; padding-bottom: 80px; z-index: 1;
        }

        .card {
            font-family: 'Poppins', sans-serif;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 25px;
            display: flex; flex-direction: column;
            transition: all 0.3s ease;
            min-height: 160px;
        }
        .card:hover { border-color: var(--accent-bright); transform: translateY(-5px); background: rgba(5, 76, 80, 0.12); box-shadow: 0 10px 20px rgba(5, 76, 80, 0.25); }

        .author-tag { font-size: 0.75rem; font-weight: 600; color: var(--accent-bright); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
        .title { font-size: 0.9rem; font-weight: 400; line-height: 1.6; color: var(--text-main); margin-bottom: 15px; }

        .footer-info {
            font-size: 0.75rem; font-weight: 300; color: var(--text-dim);
            border-top: 1px solid rgba(5, 76, 80, 0.3);
            padding-top: 15px; margin-top: auto; word-break: break-all;
        }

        .link-text {
            color: var(--accent-bright);
            text-decoration: underline;
            transition: color 0.2s;
        }
        .link-text:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="fluid-background">
        <div class="fluid-layer layer-1"></div>
        <div class="fluid-layer layer-2"></div>
    </div>

    <div class="nav-instruction">
        🌱 <b>Instrucción de Navegación:</b> Consulta las referencias sobre construcción sostenible, análisis de ciclo de vida, gestión de residuos y eficiencia energética en edificaciones.
    </div>

    <header class="main-header">
        <h1>Bibliografía</h1>
        <div class="line"></div>
    </header>

    <main class="reference-grid" id="grid"></main>

    <script>
        const sources = [
            { a: "Caballos, S., González, D., & Sánchez, J. (2021)", t: "Construction and Demolition Waste (C&DW) Recycling Generated at the Universidad del Valle (Meléndez) for the Manufacture of Paving Stones", f: "Revista ION", u: "https://doi.org/10.18273/revion.v34n1-2021003" },
            { a: "Cabeza, L. et al. (2014)", t: "Life cycle assessment (LCA) and life cycle energy analysis (LCEA) of buildings and the building sector: A review", f: "Renewable and Sustainable Energy Reviews", u: "https://doi.org/10.1016/j.rser.2013.08.037" },
            { a: "Dixit, M. K. (2017)", t: "Life cycle embodied energy analysis of residential buildings: A review of literature to investigate embodied energy parameters", f: "Renewable and Sustainable Energy Reviews", u: "https://doi.org/10.1016/j.rser.2017.05.051" },
            { a: "Doan, D. et al. (2017)", t: "A critical comparison of green building rating systems", f: "Sustainable Development", u: "https://doi.org/10.1016/j.buildenv.2017.07.007" },
            { a: "Dopazo, P. R. (2022)", t: "Impacto ambiental y prácticas ecoeficientes institucionales", f: "UNEP FI", u: "https://www.unepfi.org/wordpress/wp-content/uploads/2022/05/Patricia-Rodriguez-Dopazo-Impacto-Ambiental-y-Practicas-Ecoeficientes-Institucionale.pdf" },
            { a: "Encyclopedia of Electrochemical Power Sources (2025)", t: "Huella de carbono: Una visión general", f: "ScienceDirect", u: "https://www.sciencedirect.com/topics/engineering/carbon-footprint" },
            { a: "FAO (2020)", t: "Global Forest Resources Assessment 2020", f: "Food and Agriculture Organization" },
            { a: "IEA (2021)", t: "Energy Efficiency 2022", f: "International Energy Agency", u: "https://www.iea.org/reports/energy-efficiency-2022" },
            { a: "IFC (2019)", t: "Edge. International Finance Corporation", f: "IFC", u: "https://edgebuildings.com/resources/?lang=es" },
            { a: "Kibert, C. J. (2016)", t: "Sustainable Construction: Green Building Design and Delivery (4th ed.)", f: "Wiley" },
            { a: "Knauf (2025)", t: "Materiales de bajo impacto ambiental", f: "Knauf Blog", u: "https://blog.knauf.com/es-es/materiales-de-bajo-impacto-ambiental" },
            { a: "LCC (2023)", t: "Del residuo al recurso: procesos de reciclaje y reutilización", f: "Leen Compacting Company", u: "https://lcc.eco/procesos-de-reciclaje-y-reutilizacion/" },
            { a: "Minunno, R. et al. (2021)", t: "Investigating the embodied energy and carbon of buildings: A systematic literature review and meta-analysis of life cycle assessments", f: "Renewable and Sustainable Energy Reviews" },
            { a: "Pomponi, F., & Moncaster, A. (2017)", t: "Circular economy for the built environment: A research framework", f: "Journal of Cleaner Production", u: "https://doi.org/10.1016/j.jclepro.2016.12.055" },
            { a: "Portal Camins (2020)", t: "Análisis del Ciclo de Vida", f: "UPC", u: "https://portal.camins.upc.edu/materials_guia/250504/2013/Analisis%20del%20Ciclo%20de%20Vida.pdf" },
            { a: "Reyes, J. et al. (2018)", t: "Urban Integrated Sustainable Assessment Methodology for Existing Neighborhoods (UISA fEN)", f: "Sustainable Development", u: "https://doi.org/10.1002/sd.1720" },
            { a: "UNEP (2021)", t: "2021 Global Status Report for Buildings and Construction", f: "United Nations Environment Programme", u: "https://www.unep.org/resources/report/2021-global-status-report-buildings-and-construction" },
            { a: "USGBC (2020)", t: "LEED Core Concepts Guide", f: "U.S. Green Building Council", u: "https://www.usgbc.org/guide/bdc" },
            { a: "Viezzer, J., & Biondi, D. (2021)", t: "The influence of urban, socio-economic, and eco-environmental aspects on COVID-19 cases, deaths and mortality", f: "Sustainable Cities and Society" }
        ];

        const grid = document.getElementById('grid');

        sources.forEach((s) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let footerContent = s.f;
            if (s.u) {
                footerContent += ` — <a href="${s.u}" target="_blank" class="link-text">${s.u}</a>`;
            }

            let html = `
                <div class="author-tag">${s.a}</div>
                <div class="title">${s.t}</div>
                <div class="footer-info">${footerContent}</div>
            `;

            card.innerHTML = html;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
